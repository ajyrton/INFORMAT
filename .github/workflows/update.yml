name: Actualizar noticias

on:
  schedule:
    - cron: "*/30 * * * *"   # cada 30 minutos
  workflow_dispatch:          # botón manual en la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - name: Descargar, agrupar y resumir
        env:
          # Opcionales: sin ellos no hay resúmenes con IA y la web muestra titulares (coste 0).
          LLM_API_URL: ${{ secrets.LLM_API_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_MAX_STORIES: ${{ vars.LLM_MAX_STORIES }}
        run: python fetch_news.py
      - name: Guardar cambios
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Actualizar noticias" && git push)
